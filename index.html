<script>
  const hamburger = document.querySelector('.hamburger');
  const navLinks = document.querySelector('.nav-links');
  const overlay = document.querySelector('.overlay');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  });
  if(overlay){
    overlay.addEventListener('click', () => {
      navLinks.classList.remove('active');
      overlay.classList.remove('active');
    });
  }
</script>

<!-- PWA OFFLINE CODE - ADDED (does not remove your code) -->
<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'lockedin-v1';
    self.addEventListener('install', e=>{
      e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./','./index.html','./lockin.css','./Mages/logo.png'])));
    });
    self.addEventListener('fetch', e=>{
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
        return caches.open(CACHE).then(c=>{c.put(e.request, res.clone()); return res;});
      })));
    });
  `;
  const blob = new Blob([swCode], {type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob))
   .then(()=>console.log('Locked In is now offline ready!'));
}
</script>
